<!doctype html>
<html lang="el">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://moodboard-api.haroldpoi.dev" crossorigin />
		<link rel="preconnect" href="https://images.haroldpoi.dev" />
		<script>
			// A public board (/s/<id>) asks for its data now, while the app's code still downloads.
			// src/lib/share.ts (loadPublic) takes this answer when the URL matches its own.
			try {
				var pm = location.pathname.match(/^\/s\/([^/]+)\/?$/);
				if (pm) {
					var pu = 'https://moodboard-api.haroldpoi.dev/api/mb/public/' + pm[1];
					window.__mbBoard = { url: pu, res: fetch(pu, { credentials: 'omit' }) };
					// The cards nearest the middle of the board are what the first view shows (the automatic
					// fit centres the board). Their 480 px thumbnails start now, with the same urls the cards
					// use (thumbUrl in src/lib/inspirations.ts), so they download while the app's code does.
					// Held in __mbThumbs so the browser keeps them for the cards.
					window.__mbBoard.res
						.then(function (r) {
							return r.ok ? r.clone().json() : null;
						})
						.then(function (b) {
							if (!b || !b.inspirations) return;
							var pos = b.positions || {};
							var list = b.inspirations.filter(function (i) { return !i.crop || i.crop.w >= 0.6; });
							var xs = [], ys = [];
							list.forEach(function (i) { var p = pos[i.id]; if (p) { xs.push(p.x); ys.push(p.y); } });
							var cx = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
							var cy = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
							var dist = function (i) { var p = pos[i.id]; return p ? Math.hypot(p.x - cx, p.y - cy) : Infinity; };
							list.sort(function (a, c) { return dist(a) - dist(c) || 0; });
							window.__mbThumbs = list.slice(0, 24).map(function (i) {
								var im = new Image();
								im.decoding = 'async';
								im.src = pu + '/files/' + encodeURIComponent(i.id) + '?thumb=480x0';
								return im;
							});
						})
						.catch(function () {});
				}
			} catch (e) {}
		</script>
		<script>
			// Appearance before first paint (see src/lib/appearance.ts).
			try {
				var a = JSON.parse(localStorage.getItem('moodboard.appearance') || '{}');
				var r = document.documentElement;
				if (a.theme === 'light' || a.theme === 'dark') r.dataset.theme = a.theme;
				if (/^#[0-9a-f]{6}$/i.test(a.lc)) r.style.setProperty('--canvas-light', a.lc);
				if (/^#[0-9a-f]{6}$/i.test(a.dc)) r.style.setProperty('--canvas-dark', a.dc);
			} catch (e) {}
		</script>
		<style>
			/* The boot screen: shown until the first page has its data (the root layout removes it). */
			:root { color-scheme: light dark; }
			:root[data-theme='light'] { color-scheme: light; }
			:root[data-theme='dark'] { color-scheme: dark; }
			body { margin: 0; background: light-dark(var(--canvas-light, #f4f1eb), var(--canvas-dark, #161513)); }
			#boot {
				position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
				font: 15px/1.4 system-ui, sans-serif; color: light-dark(#6d675e, #a39d92);
				opacity: 0; animation: boot-in 0.2s 0.15s forwards;
			}
			#boot i {
				width: 26px; height: 26px; border-radius: 50%;
				border: 2.5px solid light-dark(#e3ddd3, #2e2b27); border-top-color: light-dark(#b4532a, #e07a4c);
				animation: boot-spin 0.8s linear infinite;
			}
			@keyframes boot-in { to { opacity: 1; } }
			@keyframes boot-spin { to { transform: rotate(1turn); } }
			@media (prefers-reduced-motion: reduce) { #boot i { animation-duration: 2.4s; } }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" role="status" aria-live="polite">
			<i aria-hidden="true"></i>
			<span id="boot-text">Φόρτωση…</span>
		</div>
		<script>
			try {
				var l = [localStorage.getItem('moodboard:lang')].concat(navigator.languages || []);
				for (var k = 0; k < l.length; k++) {
					var b = (l[k] || '').toLowerCase().split('-')[0];
					if (b === 'el') break;
					if (b === 'en') { document.getElementById('boot-text').textContent = 'Loading…'; break; }
				}
			} catch (e) {}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
